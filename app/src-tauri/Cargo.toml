[package]
name = "nous"
version = "0.1.0"
description = "Nous - Honkai: Star Rail companion"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "nous_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
nous-core = { path = "../../crates/nous-core" }
nous-veritas = { path = "../../crates/nous-veritas" }
ron = "0.10.1"
regex = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }
nous-hsr = { path = "../../crates/nous-hsr" }
# Also used by the existing optional Veritas integration.
futures = "0.3"
ureq = { version = "3", features = ["json"] }

tauri-plugin-single-instance = "2"
is_elevated = "0.1.2"
sysinfo = "0.38.4"
winreg = "0.56.0"
rust_socketio = { version = "0.6.0", features = ["async"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["time"] }
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

