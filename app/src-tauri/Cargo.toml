[package]
name = "nous"
version = "0.1.0"
description = "Nous - Honkai: Star Rail companion"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "nous_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
# game traffic: local clone of https://github.com/IceDynamix/reliquary (tag v24.0.0 = game 4.6)
reliquary = { path = "../../vendor/reliquary" }
protobuf = "=3.7.1" # must match reliquary's generated code
pktmon = { version = "0.6.2", features = ["tokio"] }
futures = "0.3"
# login recordings (recorder.rs)
base64 = "0.22"
is_elevated = "0.1.2"
tauri-plugin-single-instance = "2"
sysinfo = "0.38.4"
winreg = "0.56.0"

[profile.dev]
# hoyo's kcp uses a header field in a way that overflows the kcp crate's math (as in reliquary-archiver)
overflow-checks = false

[profile.release]
overflow-checks = false

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

