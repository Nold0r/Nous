# Модуль Nous: как показать его в программе. Функционал — в ui.tsx
# (экран) и module.rs (Rust, если нужен). Подробно: docs/Архитектура/Модули.md

[module]
id = "characters"        # = имя папки
title = "Персонажи"
kind = "tab"             # tab — вкладка в меню, settings — раздел в Настройках

[tab]                    # только для вкладки
icon = "characters"      # иконка из assets/icons/sign
category = "inventory"   # раздел меню, см. src/features/categories.ts
order = 0
