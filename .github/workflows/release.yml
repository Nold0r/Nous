# Every push to main builds the Windows installers and publishes them as a new
# GitHub release. Installed copies of Nous find it through latest.json and
# update themselves (tauri-plugin-updater).
#
# Version: major.minor come from app/src-tauri/tauri.conf.json, the patch is the
# workflow run number, so each release is newer than the last one.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# one release at a time, in push order
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # reliquary is a submodule (path dependency of src-tauri)
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # reliquary needs a recent stable Rust (cfg_select!, 1.95+)
      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Stamp version
        working-directory: app/src-tauri
        shell: pwsh
        run: |
          $conf = Get-Content tauri.conf.json -Raw | ConvertFrom-Json
          $parts = $conf.version.Split('.')
          $version = "$($parts[0]).$($parts[1]).${{ github.run_number }}"
          (Get-Content tauri.conf.json -Raw) -replace '"version": "[^"]+"', "`"version`": `"$version`"" |
            Set-Content tauri.conf.json -NoNewline
          echo "Nous $version"

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signs the update packages; the public key is in tauri.conf.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: Nous v__VERSION__
          releaseBody: Установщики для Windows ниже. Уже установленный Nous обновится сам. Запускайте его от администратора, чтобы он видел вход в игру.
          releaseDraft: false
          prerelease: false
