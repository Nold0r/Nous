[package]
name = "hsr-sniff"
version = "0.1.0"
edition = "2024"
publish = false

# Throwaway spike: dump decrypted HSR game commands to disk to see what the
# map/chest packets actually contain.

[dependencies]
# local clone of https://github.com/IceDynamix/reliquary at tag v24.0.0
# (cargo's built-in git fetch hung on this repo)
reliquary = { path = "../../vendor/reliquary" }
protobuf = "=3.7.1"
protobuf-json-mapping = "=3.7.1"
pktmon = { version = "0.6.2", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde_json = "1"
base64 = "0.22"
chrono = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
# same as reliquary-archiver: hoyo's kcp uses a field in a way that overflows
overflow-checks = false

[profile.release]
overflow-checks = false
